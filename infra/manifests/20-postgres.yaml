# Postgres 18: database 2개 — catalog (Iceberg JDBC 카탈로그), source (소스 테이블)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: storage
data:
  10-create-source.sql: |
    CREATE DATABASE source;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: storage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        role: storage
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              value: catalog
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {containerPort: 5432, name: pg}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "spark", "-d", "catalog"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: storage
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - {name: pg, port: 5432, targetPort: 5432, nodePort: 30543}
